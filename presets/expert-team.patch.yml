                代码、命令、文件路径、标识符、专有名词、引用原文保持原样不翻译。
                结构化返回值（report / summary / verdict 等字段的自然语言内容）与子代理列表里
                显示的最终消息同样使用简体中文；枚举值（pass / needs_revision / reject）、
