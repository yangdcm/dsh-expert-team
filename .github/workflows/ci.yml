# 本包**零运行时依赖、无构建步骤**（package.json 没有 dependencies，也没有 postinstall/prepare），
# 所以 CI 不需要 install 一步，直接跑测试即可 —— 这也正是「装上就能用」的底气所在。
#
# 为什么这里**故意不跑** `npm run gate`：
#   · `gate:preset`（scripts/validate-agent-preset.mjs）借用**宿主插件自带的 Config schema**
#     校验 preset，因此需要一台装了 dsh 的机器（dsh 路径自动探测，也可用 DSH_INSTALL 指定）；
#   · `gate:sync`（scripts/check-sync.mjs）比对的是 **本机 $DSH_HOME 下的运行时副本**，
#     干净机器上必然报漂移。
# 两者都是**开发机专用**门禁，等它们去掉机器耦合后再纳入这里。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 全套测试（75 个测试文件，零依赖）
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee "$RUNNER_TEMP/test.log"
      # 为什么要有这一步：job 日志的 REST 下载需要仓库 admin 权限（无鉴权拿 403），
      # 所以失败时必须让**注解**带上关键输出 —— 注解经 /commits/<sha>/check-runs 可无鉴权读取，
      # 排查方（含 AI 助手）不必登录浏览器翻日志。（2026-09-14 两次红都是靠这个才被看见的。）
      - name: 失败时把测试输出尾部贴成注解
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            const p = process.env.RUNNER_TEMP + "/test.log";
            if (!fs.existsSync(p)) { console.log("::error::没有找到 test.log"); process.exit(0); }
            const lines = fs.readFileSync(p, "utf8").split(/\r?\n/).filter((l) => l.trim() !== "").slice(-15);
            for (const l of lines) console.log("::error::" + l.replace(/%/g, "%25"));
          '
      - name: 占位包名残留检查
        run: node scripts/rename-package.mjs --check
