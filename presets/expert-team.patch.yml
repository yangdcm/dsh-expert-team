          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.5
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ── role preset: researcher（调研员）──────────────────────────────
    - id: preset-expert-team-researcher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: expert-team-researcher
        name: 专家团·调研员
        description: 专家团角色子预设：调研员（代码定位、依赖梳理、只读环境检查）
        order: 53
        plugins:
          - id: persona
