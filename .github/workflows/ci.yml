# 本包**零运行时依赖、无构建步骤**（package.json 没有 dependencies，也没有 postinstall/prepare），
# 所以 CI 不需要 install 一步，直接跑测试即可 —— 这也正是「装上就能用」的底气所在。
#
# 为什么这里**故意不跑** `npm run gate`：
#   · `gate:preset`（scripts/validate-agent-preset.mjs）默认指向本机 dsh 安装路径，
#     需要 DSH_INSTALL 才可移植；
#   · `gate:sync`（scripts/check-sync.mjs）比对的是 **本机 $DSH_HOME 下的运行时副本**，
#     干净机器上必然报漂移。
# 两者都是**开发机专用**门禁，等它们去掉机器耦合后再纳入这里。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 全套测试（75 个测试文件，零依赖）
        run: npm run test:all
      - name: 占位包名残留检查
        run: node scripts/rename-package.mjs --check
